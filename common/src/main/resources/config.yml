# ==============================================================================
#                       ImageFrame Configuration (Fabric)
# ==============================================================================

Settings:
  # Default language for ImageFrame messages and commands.
  # Available by default: en_us, es_es, de_de, fr_fr, zh_cn
  Language: "en_us"

  # Date format used when displaying map creation time in /imageframe info
  DateFormat: "dd/MM/yyyy HH:mm:ss zzz"

  # Display name format for individual map items
  MapItemFormat: "&f{Name} &7({X}, {Y})"

  # If true, survival players must have empty maps in their inventory
  # to create (/imageframe create) or retrieve (/imageframe get) image maps.
  RequireEmptyMaps: true

  # If true, running '/imageframe get <name>' without arguments gives the combined
  # map item instead of separate map tiles.
  CombinedByDefault: false

  # Maximum allowed width and height for an image map (in blocks).
  # Set to -1 for no limit.
  MaxSize: 100

  # Restrict image downloads to only trusted website domains.
  RestrictImageUrl:
    Enabled: false
    Whitelist:
      - "https://i.imgur.com"
      - "http://i.imgur.com"
      - "https://storage.googleapis.com"
      - "http://storage.googleapis.com"
      - "https://cdn.discordapp.com"
      - "http://cdn.discordapp.com"
      - "https://media.discordapp.net"
      - "http://media.discordapp.net"
      - "https://textures.minecraft.net"
      - "http://textures.minecraft.net"

  # Maximum image file download size in bytes (default 52428800 = 50 MB).
  MaxImageFileSize: 52428800

  # Maximum time in seconds allowed to download and process an image before timing out.
  MaxProcessingTime: 60

  # Maximum number of image maps a player can own.
  # Players with 'imageframe.createlimit.unlimited' or OP level 2 are exempt.
  # Custom permission groups: 'imageframe.createlimit.<group>' (e.g. imageframe.createlimit.vip)
  # Set -1 for unlimited.
  PlayerCreationLimit:
    default: 10
    vip: 25
    moderator: 50

# Survival-friendly invisible item frame mechanics:
# Throwing an Invisibility splash potion / lingering potion onto dropped item frames
# converts them into invisible item frames.
InvisibleFrame:
  # Maximum item frames converted per splash potion (-1 for unlimited, 0 to disable).
  MaxConversionsPerSplash: 8

  # Whether empty invisible item frames glow so players can locate them when no item is inside.
  GlowEmptyFrames: true
